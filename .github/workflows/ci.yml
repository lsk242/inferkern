name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check inferkern/ tests/ harness/ || true
      - run: pytest -q
      - name: Docker smoke (heuristic, no LLM)
        run: |
          docker build -f docker/Dockerfile -t inferkern:dev .
          docker run --rm -e INFERKERN_GOAL=/goals/smoke-test/goal.yaml -e INFERKERN_KEEP_ALIVE=0 -v "$PWD/goals:/goals:ro" inferkern:dev
