[project]
name = "inferkern"
version = "0.1.0"
description = "The Linux distro where PID 1 is an LLM agent loop — agent package"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[project.scripts]
inferkern-agent = "inferkern.agent.loop:main"
inferkern-sup = "inferkern.supervisor.sup:main"
inferkern-check = "inferkern.agent.checks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
