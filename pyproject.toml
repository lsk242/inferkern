[project]
name = "inferkern"
version = "0.1.0"
description = "The Linux distro where PID 1 is an LLM agent loop"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["agent*", "qemu*", "harness*", "tests*"]

[project.scripts]
inferkern-agent = "agent.main:main"
inferkern-sup = "qemu.supervisor:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
