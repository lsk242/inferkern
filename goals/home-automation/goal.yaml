name: home-automation
description: |
  Converge to Home Assistant — smart home hub on :8123 with Mosquitto MQTT. Verifies HA HTTP and MQTT broker.

budget:
  max_steps: 50
  max_tokens: 220000
  timeout_min: 15

llm:
  endpoint: ""
  api_key: ""
  model: ""

accept:
  - "checks/homeassistant-http.sh"
  - "checks/mqtt-broker.sh"

constraints:
  allow: ["probe","exec","read_file","write_file","list_dir","pkg_install","pkg_update","service_start","service_status","service_stop","run_checks","journal"]
  deny: []
