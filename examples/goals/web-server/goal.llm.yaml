# Same goal but driven by a real LLM (set LLM_ENDPOINT + LLM_API_KEY env vars).
name: web-server
description: |
  Converge this Alpine system into a working nginx web server.
  - Install nginx via apk
  - Create /etc/nginx/http.d/inferkern.conf serving /srv/www on port 80
  - Create a simple index.html in /srv/www
  - Validate config with nginx -t and start nginx
  - Verify http://127.0.0.1/ returns HTTP 200

llm:
  provider: openai
  endpoint: ${LLM_ENDPOINT}  # e.g. https://api.openai.com/v1
  api_key: ${LLM_API_KEY}
  model: gpt-4o-mini

budget:
  max_steps: 30
  max_tokens: 100000
  timeout_min: 15

constraints:
  allow: [exec, read_file, write_file, list_dir, check, probe]
  deny: []

accept:
  - ../../checks/http-200.sh
